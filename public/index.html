<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ask Pure Grounds Coffee Co.</title>
    <meta
      name="description"
      content="Chat with Pure Grounds Coffee Co.'s AI assistant about our coffees, pricing, brewing tips, and business bundles."
    />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="https://puregroundscoffee.com" target="_blank" rel="noopener">
        <img class="brand__logo" src="/assets/logo.png" alt="Pure Grounds Coffee Co." width="32" height="32" />
        <span class="brand__name">Pure Grounds Coffee Co.</span>
      </a>
      <a class="site-header__link" href="https://puregroundscoffee.com" target="_blank" rel="noopener">
        Shop <span aria-hidden="true">&rarr;</span>
      </a>
    </header>

    <main class="chat">
      <div class="chat__hero">
        <img
          src="/assets/hero.webp"
          alt="Coffee drying beds on Pure Grounds Coffee Co.'s farm in the mountains of Davao Del Sur"
        />
        <div class="chat__hero-overlay">
          <h1>Ask us anything about our coffee</h1>
        </div>
      </div>

      <div id="messages" class="chat__messages" aria-live="polite"></div>

      <form id="composer" class="composer">
        <textarea
          id="input"
          class="composer__input"
          placeholder="Ask about our coffee..."
          rows="1"
          maxlength="2000"
          enterkeyhint="send"
          required
        ></textarea>
        <button type="submit" class="composer__send" id="send-button">Send</button>
      </form>
    </main>

    <footer class="site-footer">
      <span id="model-indicator" class="model-indicator" hidden></span>
      <p class="site-footer__visit">
        Visit us at <a href="https://puregroundscoffee.com" target="_blank" rel="noopener">puregroundscoffee.com</a>
      </p>
    </footer>

    <script src="/app.js" type="module"></script>
  </body>
</html>
